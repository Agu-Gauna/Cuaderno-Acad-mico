<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno académico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --paper: #F6F3EC;
    --paper-line: #DAD3C2;
    --ink: #262F38;
    --ink-soft: #5C6470;
    --tarea: #2C5F8A;
    --tarea-bg: #E1EBF3;
    --tp: #A9761F;
    --tp-bg: #F3E9D6;
    --tif: #A6373B;
    --tif-bg: #F5E1E1;
    --done: #9A968A;
    --urg-overdue: #A6373B;
    --urg-overdue-bg: #F5E1E1;
    --urg-today: #B8541C;
    --urg-today-bg: #F6E2D2;
    --urg-week: #2C5F8A;
    --urg-week-bg: #E1EBF3;
    --urg-far: #5C6470;
    --urg-far-bg: #EAE7DD;
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; }
  #app {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 90px;
  }
  h1 {
    font-family: 'Roboto', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .subt {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 16px;
    padding-bottom: 4px;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Roboto', sans-serif;
    color: var(--ink-soft);
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active.tab-todas { color: #fff; background: var(--ink); border-color: var(--ink); }
  .tab.active.tab-tarea { color: var(--tarea); background: var(--tarea-bg); border-color: var(--tarea); }
  .tab.active.tab-tp { color: var(--tp); background: var(--tp-bg); border-color: var(--tp); }
  .tab.active.tab-tif { color: var(--tif); background: var(--tif-bg); border-color: var(--tif); }
  .stats {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .stats span { white-space: nowrap; }
  .item-list { display: flex; flex-direction: column; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--paper-line);
    cursor: pointer;
  }
  .item.done { opacity: 0.55; }
  .check {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--ink-soft);
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .check.on { background: var(--ink); border-color: var(--ink); }
  .check.on::after { content: "✓"; color: #fff; font-size: 12px; }
  .item-body { flex: 1; min-width: 0; }
  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .item-title { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .item.done .item-title { text-decoration: line-through; }
  .urg-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .urg-overdue { color: var(--urg-overdue); background: var(--urg-overdue-bg); }
  .urg-today { color: var(--urg-today); background: var(--urg-today-bg); }
  .urg-week { color: var(--urg-week); background: var(--urg-week-bg); }
  .urg-far { color: var(--urg-far); background: var(--urg-far-bg); }
  .item-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .item-exact-date { font-size: 11px; color: var(--ink-soft); }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .b-tarea { color: var(--tarea); background: var(--tarea-bg); }
  .b-tp { color: var(--tp); background: var(--tp-bg); }
  .b-tif { color: var(--tif); background: var(--tif-bg); }
  .item-materia { font-size: 12px; color: var(--ink-soft); }
  .drive-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 12px;
  }
  .drive-status { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); }
  .drive-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); flex-shrink: 0; }
  .drive-dot.on { background: var(--actividad, #3E6B5C); }
  .drive-btn {
    font-size: 12px;
    font-weight: 700;
    font-family: 'Roboto', sans-serif;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: none;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-family: 'Roboto', sans-serif;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 480px;
    border-radius: 16px 16px 0 0;
    padding: 20px 18px 24px;
    max-height: 85vh;
    overflow-y: auto;
    font-family: 'Roboto', sans-serif;
  }
  .sheet h2 {
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 14px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Roboto', sans-serif;
    background: #fff;
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .type-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .type-btn {
    flex: 1 1 auto;
    padding: 8px 6px;
    border-radius: 8px;
    border: 2px solid var(--paper-line);
    background: #fff;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Roboto', sans-serif;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .type-btn.sel-tarea { border-color: var(--tarea); color: var(--tarea); background: var(--tarea-bg); }
  .type-btn.sel-tp { border-color: var(--tp); color: var(--tp); background: var(--tp-bg); }
  .type-btn.sel-tif { border-color: var(--tif); color: var(--tif); background: var(--tif-bg); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Roboto', sans-serif;
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--paper-line); }
  .btn-danger { background: var(--tif-bg); color: var(--tif); border: 1px solid var(--tif); }
  .err { font-size: 12px; color: var(--tif); margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const TYPES = [
  { id: 'tarea', label: 'Tarea' },
  { id: 'tp', label: 'TP' },
  { id: 'tif', label: 'TIF' }
];
const STORAGE_KEY = 'cuaderno-academico-items';

const DRIVE_CLIENT_ID = '560217298313-privh6722gvl37i40l9iouoi7h2ub0rq.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'cuaderno-academico-datos.json';

let driveTokenClient = null;
let driveAccessToken = null;
let driveFileId = null;
let driveStatus = 'disconnected';

let items = [];
let activeTab = 'todas';
let editingId = null;
let draft = {};

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

function loadItems() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
  } catch (e) {
    items = [];
  }
  render();
}

function saveItems() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  } catch (e) {
    console.error('No se pudo guardar', e);
  }
  if (driveStatus === 'connected') {
    saveToDrive();
  }
}

function initDrive() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    setTimeout(initDrive, 300);
    return;
  }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: onDriveToken
  });
}

function connectDrive() {
  if (!driveTokenClient) return;
  driveStatus = 'connecting';
  updateDriveUI();
  driveTokenClient.requestAccessToken({ prompt: '' });
}

function disconnectDrive() {
  if (driveAccessToken) {
    google.accounts.oauth2.revoke(driveAccessToken, () => {});
  }
  driveAccessToken = null;
  driveFileId = null;
  driveStatus = 'disconnected';
  updateDriveUI();
}

async function onDriveToken(resp) {
  if (resp.error) {
    driveStatus = 'error';
    updateDriveUI();
    return;
  }
  driveAccessToken = resp.access_token;
  driveStatus = 'connected';
  updateDriveUI();
  await syncOnConnect();
}

async function driveFetch(url, options = {}) {
  const headers = Object.assign({}, options.headers, {
    Authorization: 'Bearer ' + driveAccessToken
  });
  return fetch(url, Object.assign({}, options, { headers }));
}

async function findDriveFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    return data.files[0].id;
  }
  return null;
}

async function createDriveFile(content) {
  const metadata = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const boundary = 'cuaderno_boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  const data = await res.json();
  return data.id;
}

async function updateDriveFile(fileId, content) {
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: content
  });
}

async function readDriveFile(fileId) {
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return res.text();
}

async function syncOnConnect() {
  try {
    driveFileId = await findDriveFile();
    if (driveFileId) {
      const remoteText = await readDriveFile(driveFileId);
      const remoteItems = remoteText ? JSON.parse(remoteText) : [];
      items = remoteItems;
      saveItemsLocalOnly();
      render();
    } else {
      driveFileId = await createDriveFile(JSON.stringify(items));
    }
  } catch (e) {
    console.error('Error sincronizando con Drive', e);
    driveStatus = 'error';
  }
  updateDriveUI();
}

function saveItemsLocalOnly() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  } catch (e) {}
}

let driveSaveTimer = null;
function saveToDrive() {
  clearTimeout(driveSaveTimer);
  driveSaveTimer = setTimeout(async () => {
    try {
      if (!driveFileId) {
        driveFileId = await createDriveFile(JSON.stringify(items));
      } else {
        await updateDriveFile(driveFileId, JSON.stringify(items));
      }
    } catch (e) {
      console.error('Error guardando en Drive', e);
    }
  }, 800);
}

function updateDriveUI() {
  const dot = document.getElementById('drive-dot');
  const text = document.getElementById('drive-status-text');
  const btn = document.getElementById('drive-btn');
  if (!dot || !text || !btn) return;
  if (driveStatus === 'connected') {
    dot.classList.add('on');
    text.textContent = 'Google Drive: conectado';
    btn.textContent = 'Desconectar';
  } else if (driveStatus === 'connecting') {
    dot.classList.remove('on');
    text.textContent = 'Google Drive: conectando...';
    btn.textContent = 'Conectar';
  } else if (driveStatus === 'error') {
    dot.classList.remove('on');
    text.textContent = 'Google Drive: hubo un error, reintentá';
    btn.textContent = 'Conectar';
  } else {
    dot.classList.remove('on');
    text.textContent = 'Google Drive: no conectado';
    btn.textContent = 'Conectar';
  }
}

function fmtDate(d) {
  if (!d) return 'Sin fecha';
  const [y,m,day] = d.split('-');
  return `${day}/${m}`;
}

function isOverdue(item) {
  return !item.done && item.fecha && item.fecha < todayStr();
}

function urgencyInfo(item) {
  if (!item.fecha) return { text: 'Sin fecha', cls: 'urg-far' };
  if (item.done) return { text: 'Hecho', cls: 'urg-far' };
  const today = new Date(todayStr() + 'T00:00:00');
  const due = new Date(item.fecha + 'T00:00:00');
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return { text: `Vencido hace ${-diff} día${-diff === 1 ? '' : 's'}`, cls: 'urg-overdue' };
  if (diff === 0) return { text: 'Vence hoy', cls: 'urg-today' };
  if (diff === 1) return { text: 'Vence mañana', cls: 'urg-today' };
  if (diff <= 6) return { text: `En ${diff} días`, cls: 'urg-week' };
  return { text: `En ${diff} días`, cls: 'urg-far' };
}

function render() {
  const app = document.getElementById('app');
  const filtered = activeTab === 'todas' ? items : items.filter(i => i.tipo === activeTab);
  filtered.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.fecha) return 1;
    if (!b.fecha) return -1;
    return a.fecha.localeCompare(b.fecha);
  });

  const pendientes = items.filter(i => !i.done).length;
  const vencidas = items.filter(isOverdue).length;

  app.innerHTML = `
    <h1>Cuaderno académico</h1>
    <p class="subt">Tareas, TPs y TIFs en un solo lugar.</p>
    <div class="stats">
      <span>${pendientes} pendiente${pendientes===1?'':'s'}</span>
      ${vencidas > 0 ? `<span style="color:var(--tif); font-weight:700;">· ${vencidas} vencida${vencidas===1?'':'s'}</span>` : ''}
    </div>
    <div class="drive-bar" id="drive-bar">
      <div class="drive-status">
        <span class="drive-dot" id="drive-dot"></span>
        <span id="drive-status-text">Google Drive: no conectado</span>
      </div>
      <button class="drive-btn" id="drive-btn">Conectar</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="item-list" id="list"></div>
  `;

  const tabs = document.getElementById('tabs');
  const tabDefs = [{id:'todas', label:'Todas'}, ...TYPES];
  tabDefs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab tab-' + t.id + (activeTab === t.id ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => { activeTab = t.id; render(); };
    tabs.appendChild(btn);
  });

  const list = document.getElementById('list');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">No hay nada acá todavía.<br>Tocá el botón + para agregar algo.</div>`;
  } else {
    filtered.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item' + (item.done ? ' done' : '');
      const typeLabel = TYPES.find(t => t.id === item.tipo)?.label || item.tipo;
      const urg = urgencyInfo(item);
      row.innerHTML = `
        <div class="check ${item.done ? 'on' : ''}" data-check="${item.id}"></div>
        <div class="item-body" data-open="${item.id}">
          <div class="item-top">
            <div class="item-title">${escapeHtml(item.titulo)}</div>
            <div class="urg-pill ${urg.cls}">${urg.text}</div>
          </div>
          <div class="item-meta">
            <span class="badge b-${item.tipo}">${typeLabel}</span>
            ${item.materia ? `<span class="item-materia">${escapeHtml(item.materia)}</span>` : ''}
            ${item.fecha ? `<span class="item-exact-date">${fmtDate(item.fecha)}</span>` : ''}
          </div>
        </div>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll('[data-check]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        toggleDone(el.dataset.check);
      };
    });
    list.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => openSheet(el.dataset.open);
    });
  }

  let fab = document.querySelector('.fab');
  if (!fab) {
    fab = document.createElement('button');
    fab.className = 'fab';
    fab.textContent = '+';
    fab.setAttribute('aria-label', 'Agregar');
    fab.onclick = () => openSheet(null);
    document.body.appendChild(fab);
  }

  updateDriveUI();
  document.getElementById('drive-btn').onclick = () => {
    if (driveStatus === 'connected') {
      disconnectDrive();
    } else {
      connectDrive();
    }
  };
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toggleDone(id) {
  const item = items.find(i => i.id === id);
  if (item) {
    item.done = !item.done;
    saveItems();
    render();
  }
}

function openSheet(id) {
  editingId = id;
  const existing = id ? items.find(i => i.id === id) : null;
  draft = existing ? {...existing} : { tipo: 'tarea', titulo: '', materia: '', fecha: todayStr(), notas: '', done: false };
  renderSheet();
  document.getElementById('overlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
}

function renderSheet() {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <h2>${editingId ? 'Editar' : 'Agregar nuevo'}</h2>
    <div class="field">
      <label>Tipo</label>
      <div class="type-row" id="type-row"></div>
    </div>
    <div class="field">
      <label>Título</label>
      <input type="text" id="f-titulo" placeholder="Ej: Entregar informe de laboratorio" value="${escapeHtml(draft.titulo)}">
      <div class="err" id="err-titulo" style="display:none;">Escribí un título.</div>
    </div>
    <div class="field">
      <label>Materia</label>
      <input type="text" id="f-materia" placeholder="Ej: Física II" value="${escapeHtml(draft.materia || '')}">
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="f-fecha" value="${draft.fecha || ''}">
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <textarea id="f-notas" placeholder="Detalles, temas a repasar, links...">${escapeHtml(draft.notas || '')}</textarea>
    </div>
    <div class="sheet-actions">
      ${editingId ? `<button class="btn btn-danger" id="btn-delete">Eliminar</button>` : ''}
      <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
      <button class="btn btn-primary" id="btn-save">Guardar</button>
    </div>
  `;

  const typeRow = document.getElementById('type-row');
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'type-btn' + (draft.tipo === t.id ? ` sel-${t.id}` : '');
    btn.textContent = t.label;
    btn.onclick = () => { draft.tipo = t.id; renderSheet(); };
    typeRow.appendChild(btn);
  });

  document.getElementById('btn-cancel').onclick = closeSheet;
  document.getElementById('btn-save').onclick = saveDraft;
  const delBtn = document.getElementById('btn-delete');
  if (delBtn) delBtn.onclick = () => {
    items = items.filter(i => i.id !== editingId);
    saveItems();
    closeSheet();
    render();
  };
}

function saveDraft() {
  const titulo = document.getElementById('f-titulo').value.trim();
  const materia = document.getElementById('f-materia').value.trim();
  const fecha = document.getElementById('f-fecha').value;
  const notas = document.getElementById('f-notas').value.trim();

  if (!titulo) {
    document.getElementById('err-titulo').style.display = 'block';
    return;
  }

  if (editingId) {
    const item = items.find(i => i.id === editingId);
    Object.assign(item, { tipo: draft.tipo, titulo, materia, fecha, notas });
  } else {
    items.push({
      id: 'item-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
      tipo: draft.tipo,
      titulo, materia, fecha, notas,
      done: false
    });
  }
  saveItems();
  closeSheet();
  render();
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});

loadItems();
initDrive();
</script>
</body>
</html>
